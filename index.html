<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="author" content="Sattari Music" />
    <!-- The browser bar color follows the theme: the script below sets it before
         first paint and src/utils/theme.ts when the theme changes. -->
    <meta name="theme-color" content="#0a0a0b" />
    <!--app-head-->

    <!-- Links -->
    <link rel="icon" type="image/png" href="/sattari site/favicon.png" />
    <link rel="preload" as="image" href="/sattari site/sattari logo.avif" type="image/avif" />
    <link rel="preload" as="font" href="/fonts/inter.woff2" type="font/woff2" crossorigin />

    <!-- Apply the day/night theme before first paint to avoid a flash of the
         wrong palette. Keep this logic in sync with src/utils/theme.ts. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('sattari-theme-pref-v1') || 'auto';
          var mode = pref === 'day' || pref === 'night' ? pref : null;
          if (!mode) {
            // Auto: match the OS appearance, else fall back to the local clock.
            var mm = window.matchMedia;
            if (mm && mm('(prefers-color-scheme: dark)').matches) mode = 'night';
            else if (mm && mm('(prefers-color-scheme: light)').matches) mode = 'day';
            else {
              var h = new Date().getHours();
              mode = h >= 6 && h < 18 ? 'day' : 'night';
            }
          }
          document.documentElement.dataset.theme = mode;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'day' ? '#f6f1e6' : '#0a0a0b');
          // The homepage hero ships a still for each theme and CSS shows one
          // (HomeHeroBackground). Only this script knows which, so it starts
          // that download now instead of when the page is laid out.
          if (location.pathname === '/') {
            var still = document.createElement('link');
            still.rel = 'preload';
            still.as = 'image';
            still.href = '/images/home/video-' + mode + '-poster.jpg';
            still.setAttribute('fetchpriority', 'high');
            document.head.appendChild(still);
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'night';
        }
      })();
    </script>
  </head>
  <body>
    <form
      name="service-inquiry"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="service-inquiry" />
      <input name="source" />
      <input name="service" />
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <textarea name="details"></textarea>
      <input name="bot-field" />
    </form>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
