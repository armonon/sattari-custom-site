[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Pin the Node version so Netlify matches the version CI builds and tests
# against. Without this Netlify picks its build-image default, which can
# change under us and produce builds that pass in CI but fail here.
[build.environment]
  NODE_VERSION = "20.19.0"

[[redirects]]
  from = "/api/create-checkout-session"
  to = "/.netlify/functions/create-checkout-session"
  status = 200

[[redirects]]
  from = "/api/checkout-session-status"
  to = "/.netlify/functions/checkout-session-status"
  status = 200

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

[[redirects]]
  from = "/api/admin/orders"
  to = "/.netlify/functions/admin-orders"
  status = 200

[[redirects]]
  from = "/api/service-inquiry"
  to = "/.netlify/functions/service-inquiry"
  status = 200

[[redirects]]
  from = "/api/now/profile"
  to = "/.netlify/functions/now-profile"
  status = 200

[[redirects]]
  from = "/api/inventory"
  to = "/.netlify/functions/inventory"
  status = 200

[[redirects]]
  from = "/api/staff/login"
  to = "/.netlify/functions/staff-login"
  status = 200

[[redirects]]
  from = "/api/staff/stock"
  to = "/.netlify/functions/staff-stock"
  status = 200

[[redirects]]
  from = "/api/staff/catalog"
  to = "/.netlify/functions/staff-catalog"
  status = 200

[[redirects]]
  from = "/api/staff/orders"
  to = "/.netlify/functions/staff-orders"
  status = 200

[[redirects]]
  from = "/api/staff/backup"
  to = "/.netlify/functions/staff-backup"
  status = 200

[[redirects]]
  from = "/api/staff/image"
  to = "/.netlify/functions/staff-image"
  status = 200

[[redirects]]
  from = "/product-images/*"
  to = "/.netlify/functions/product-image"
  status = 200

# Nightly snapshot of everything the shop cannot recover from elsewhere.
# Scheduled functions run on published production deploys only, and cannot be
# triggered over HTTP — the staff-facing download and restore are separate.
[functions."nightly-backup"]
  schedule = "0 9 * * *"

# The staff page is unlisted, not secret, so it must stay out of search
# results. This header does that WITHOUT naming the path in robots.txt —
# robots.txt is public, and listing a private URL there hands it to anyone
# who asks for the file.
[[headers]]
  for = "/staff-cc6436694e.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

# Must stay last: redirects are matched in order and this one catches
# everything left over for the single-page app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
