  status = 200

[[redirects]]
  from = "/api/service-inquiry"
  to = "/.netlify/functions/service-inquiry"
  status = 200

[[redirects]]
  from = "/api/now/profile"
  to = "/.netlify/functions/now-profile"
  status = 200

[[redirects]]
