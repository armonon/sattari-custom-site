[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Pin the Node version so Netlify matches the version CI builds and tests
# against. Without this Netlify picks its build-image default, which can
# change under us and produce builds that pass in CI but fail here.
[build.environment]
  NODE_VERSION = "20.19.0"

[[redirects]]
  from = "/api/staff/insights"
  to = "/.netlify/functions/staff-insights"
  status = 200

[[redirects]]
  from = "/buy"
  to = "/shop"
  status = 301

[[redirects]]
  from = "/audio-suite"
  to = "/downloads"
  status = 301

[[redirects]]
  from = "/audio-suite/downloads"
  to = "/downloads"
  status = 301

[[redirects]]
  from = "/audio"
  to = "/downloads"
  status = 301

[[redirects]]
  from = "/services/music-classes-los-angeles"
  to = "/services/music-lessons-los-angeles"
  status = 301

[[redirects]]
  from = "/services/drum-repair-los-angeles"
  to = "/services/instrument-repair-los-angeles"
  status = 301

[[redirects]]
  from = "/stem-seperator"
  to = "/stem-separator"
  status = 301

[[redirects]]
  from = "/api/create-checkout-session"
  to = "/.netlify/functions/create-checkout-session"
  status = 200

[[redirects]]
  from = "/api/checkout-session-status"
  to = "/.netlify/functions/checkout-session-status"
  status = 200

[[redirects]]
  from = "/api/checkout-release"
  to = "/.netlify/functions/checkout-release"
  status = 200

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

# Not here on purpose: /api/admin/orders, /api/service-inquiry,
# /api/studio-bookings, /api/staff/login and /api/site-event. Those are v2
# functions whose routes are declared in their own `config.path`, which Netlify
# requires for a code-defined rate limit and matches before any redirect, so
# a rule here would be dead and could drift from the real route.

[[redirects]]
  from = "/api/staff/bookings"
  to = "/.netlify/functions/staff-bookings"
  status = 200

[[redirects]]
  from = "/api/staff/inquiries"
  to = "/.netlify/functions/staff-inquiries"
  status = 200

[[redirects]]
  from = "/api/staff/logout"
  to = "/.netlify/functions/staff-logout"
  status = 200

[[redirects]]
  from = "/api/inventory"
  to = "/.netlify/functions/inventory"
  status = 200

[[redirects]]
  from = "/api/staff/stock"
  to = "/.netlify/functions/staff-stock"
  status = 200

[[redirects]]
  from = "/api/staff/catalog"
  to = "/.netlify/functions/staff-catalog"
  status = 200

[[redirects]]
  from = "/api/staff/orders"
  to = "/.netlify/functions/staff-orders"
  status = 200

[[redirects]]
  from = "/api/staff/backup"
  to = "/.netlify/functions/staff-backup"
  status = 200

[[redirects]]
  from = "/api/staff/image"
  to = "/.netlify/functions/staff-image"
  status = 200

[[redirects]]
  from = "/product-images/*"
  to = "/.netlify/functions/product-image"
  status = 200

# Nightly snapshot of everything the shop cannot recover from elsewhere.
# Scheduled functions run on published production deploys only, and cannot be
# triggered over HTTP — the staff-facing download and restore are separate.
[functions."nightly-backup"]
  schedule = "0 9 * * *"

[functions."studio-booking-maintenance"]
  schedule = "*/5 * * * *"

[[headers]]
  for = "/studio-booking"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

# The staff page is unlisted, not secret, so it must stay out of search
# results. This header does that WITHOUT naming the path in robots.txt —
# robots.txt is public, and listing a private URL there hands it to anyone
# who asks for the file.
[[headers]]
  for = "/staff-cc6436694e.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

# Products added by staff after a build still need the live catalog lookup.
[[redirects]]
  from = "/product/*"
  to = "/app.html"
  status = 200

[[headers]]
  for = "/cart"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/checkout/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/instagram/callback"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

# Existing prerendered files take precedence; unknown URLs get a real 404.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
