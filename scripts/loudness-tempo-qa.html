<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Audio-clock metering and tempo QA</title>
  <style>
    body {
      font: 16px system-ui;
      background: #141720;
      color: #eef;
      padding: 24px;
    }
    button {
      padding: 14px;
    }
    pre {
      white-space: pre-wrap;
    }
  </style>
  <h1>Continuous loudness and variable-tempo analysis</h1>
  <p>Generated audio only. No speakers, microphones or project changes.</p>
  <button id="run">Run checks</button>
  <pre id="result">Ready</pre>
  <script type="module">
    import * as Tone from 'tone';
    import { StudioAudioEngine } from '/src/utils/studioAudioEngine.js';
    import { analyzeAudioFile } from '/src/utils/audioAnalysis.js';
    import { tempoAt } from '/src/utils/tempoMap.js';
    import { wavBytes } from '/src/utils/arrangementExport.js';
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const assert = (condition, message) => {
      if (!condition) throw Error(message);
    };
    document.querySelector('#run').onclick = async () => {
      const button = document.querySelector('#run'),
        result = document.querySelector('#result');
      button.disabled = true;
      result.textContent = '';
      let engine, oscillator, gain, heartbeat;
      try {
        engine = new StudioAudioEngine({ monitor: false, recorder: false, metering: true });
        await engine.unlock();
        await engine.loudnessPending;
        const raw = engine.getAudioContext().rawContext;
        assert(
          engine.getMasterStatus().loudness.available,
          engine.loudnessError || 'meter unavailable'
        );
        oscillator = raw.createOscillator();
        oscillator.frequency.value = 997;
        gain = raw.createGain();
        gain.gain.value = 0.1;
        oscillator.connect(gain);
        Tone.connect(gain, engine.output);
        engine.resetLoudness();
        oscillator.start();
        await wait(4300);
        const meter = engine.getMasterStatus().loudness;
        assert(Math.abs(meter.integrated + 20) < 0.3, `integrated ${meter.integrated}`);
        assert(Math.abs(meter.truePeak + 20) < 0.2, `true peak ${meter.truePeak}`);
        assert(meter.invalidSamples === 0, 'invalid meter samples');
        result.textContent += `PASS audio-thread meter: ${JSON.stringify(meter)}\n`;
        oscillator.stop();
        oscillator.disconnect();
        gain.disconnect();
        engine.resetLoudness();
        assert(engine.getMasterStatus().loudness.integrated === null, 'reset did not clear');
        const buffer = raw.createBuffer(1, raw.sampleRate * 40, raw.sampleRate),
          pcm = buffer.getChannelData(0);
        for (let time = 0.2; time < 40; time += 60 / (100 + 0.6 * time))
          for (let j = 0; j < 400; j++) {
            const i = Math.round(time * raw.sampleRate) + j;
            if (i < pcm.length) pcm[i] = Math.exp(-j / 60) * Math.cos(j);
          }
        let ticks = 0;
        heartbeat = setInterval(() => ticks++, 10);
        const start = performance.now();
        const analysis = await analyzeAudioFile(
          new File([wavBytes(buffer)], 'accelerando.wav', { type: 'audio/wav' })
        );
        clearInterval(heartbeat);
        const early = tempoAt(analysis.tempoMap.beats, 5),
          late = tempoAt(analysis.tempoMap.beats, 35);
        assert(late - early > 10, `tempo map did not track drift: ${early} → ${late}`);
        assert(ticks > 1, 'analysis blocked UI heartbeat');
        result.textContent += `PASS analysis worker: ${early.toFixed(1)} → ${late.toFixed(1)} BPM; ${(performance.now() - start).toFixed(0)}ms, ${ticks} UI heartbeats\nCOMPLETE: 2 passed`;
      } catch (error) {
        result.textContent += `FAIL ${error.stack}`;
      } finally {
        clearInterval(heartbeat);
        try {
          oscillator?.stop();
        } catch {}
        oscillator?.disconnect();
        gain?.disconnect();
        engine?.dispose();
        button.disabled = false;
      }
    };
  </script>
</html>
