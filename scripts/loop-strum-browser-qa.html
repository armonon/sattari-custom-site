<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Loop strum pipeline qualification</title>
    <style>
      body {
        font: 16px system-ui;
        background: #f7f5ef;
        color: #292b2b;
        padding: 32px;
        max-width: 900px;
        margin: auto;
      }
      button {
        padding: 14px;
        margin: 12px 0;
      }
      pre {
        white-space: pre-wrap;
        background: white;
        padding: 20px;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Loop strum pipeline qualification</h1>
    <p>
      Synthetic source → real AudioWorklet capture → model worker → chord evidence. No microphone
      access. Output is silent.
    </p>
    <button id="run">Run audio pipeline checks</button>
    <pre id="result" role="status">Ready</pre>
    <script type="module">
      import { capturePcm, preparePcmCapture } from '/src/loop/pcmCapture.js';
      import { analyzeStrum } from '/src/loop/strumClient.js';
      import { strumFixture, STRUM_CASES } from './loop-strum-fixtures.mjs';
      const button = document.querySelector('#run'),
        output = document.querySelector('#result');
      button.onclick = async () => {
        button.disabled = true;
        const report = [];
        try {
          for (const fixture of [STRUM_CASES[0], STRUM_CASES[6], STRUM_CASES[10]]) {
            output.textContent = `Running ${fixture.name}…\n${JSON.stringify(report, null, 2)}`;
            const context = new AudioContext({ sampleRate: 48000 });
            try {
              await context.resume();
              // Load before starting the scheduled source so no attack is lost to module loading.
              await preparePcmCapture(context);
              const pcm = strumFixture(fixture.played ?? fixture.expected, {
                ...fixture.options,
                rate: context.sampleRate,
              });
              const buffer = context.createBuffer(1, pcm.length, context.sampleRate);
              buffer.copyToChannel(pcm, 0);
              const source = context.createBufferSource();
              source.buffer = buffer;
              const capture = capturePcm(context, source);
              source.start(context.currentTime + 0.05);
              const take = await capture;
              const frames = take.samples.length;
              await context.close();
              const start = performance.now();
              const result = await analyzeStrum(
                { samples: take.samples, rate: take.rate, noiseFloor: 0.002 },
                fixture.expected
              );
              report.push({
                fixture: fixture.name,
                frames,
                inputFrames: take.inputFrames,
                rate: take.rate,
                inferenceMs: Math.round(performance.now() - start),
                result,
              });
            } finally {
              if (context.state !== 'closed') await context.close();
            }
          }
          const passed =
            report[0].result.status === 'matched' &&
            report[1].result.status !== 'matched' &&
            report[2].result.status === 'quiet' &&
            report.every((r) => r.frames === 120000 && r.inputFrames > 115000);
          output.textContent = `${passed ? 'PASS' : 'FAIL'}\n${JSON.stringify(report, null, 2)}`;
        } catch (error) {
          output.textContent = `FAIL: ${error.message}\n${error.stack}`;
        } finally {
          button.disabled = false;
        }
      };
    </script>
  </body>
</html>
